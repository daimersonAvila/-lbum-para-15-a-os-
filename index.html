<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Álbum Digital - Mis 15 Años</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="pageFlip">
  <div class="section bg-dark-red">
    <div class="ribbon-top"></div>

    <h1 class="main-title">Mis 15 Años</h1>

    <!-- PANTALLA 1: SELECCIÓN DE MOMENTO -->
    <div class="glass-card" id="menuCard">
      <p class="personal-message">¿Qué momento quieres compartir?</p>
      <p class="personal-message-second" style="font-size: 0.85rem; margin-bottom: 15px;">
        Elige una categoría para subir tus fotos.
      </p>

      <div class="categories-grid">
        <button class="category-btn" onclick="seleccionarCategoria('Caballo')">
          <span class="cat-icon">🐎</span> Con el Caballo
        </button>
        <button class="category-btn" onclick="seleccionarCategoria('Pastel')">
          <span class="cat-icon">🎂</span> Con el Pastel
        </button>
        <button class="category-btn" onclick="seleccionarCategoria('Quinceañera')">
          <span class="cat-icon">👑</span> Con la Quinceañera
        </button>
        <button class="category-btn" onclick="seleccionarCategoria('Especiales')">
          <span class="cat-icon">✨</span> Fotos Especiales
        </button>
        <button class="category-btn" onclick="seleccionarCategoria('Otros')">
          <span class="cat-icon">📸</span> Otras Fotos
        </button>
      </div>
    </div>

    <!-- PANTALLA 2: SUBIR FOTO -->
    <div class="glass-card" id="uploadCard" style="display: none;">
      <div class="camera-icon" id="iconoCategoria">📸</div>
      <p class="personal-message" id="tituloCategoria">Subiendo foto...</p>

      <div class="upload-zone">
        <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">

        <div class="btn-group" id="btnGroup">
          <label for="fileInput" class="btn-select">
            <span>🖼️</span> Galería
          </label>
          <label for="cameraInput" class="btn-select">
            <span>📸</span> Tomar Foto
          </label>
        </div>

        <div class="preview-container" id="previewContainer">
          
        </div>

        <button class="btn-upload" id="uploadBtn">
          <span>☁️</span> Subir Foto
        </button>

        <button class="btn-back" onclick="volverAlMenu()">
          ← Volver a los momentos
        </button>

        <div class="status-msg" id="statusMsg"></div>
      </div>
    </div>

    <a class="btn-album" href="galeria.html">🖼️ Ver el álbum de todos</a>

    <p class="small-note" style="color: rgba(249,229,150,.5); font-size: 0.75rem; margin-top: 10px;">
      Ayúdanos a crear un recuerdo inolvidable.
    </p>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
