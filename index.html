<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Álbum Digital de la Fiesta</title>

  <!-- Fuentes de Google -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">

  <!-- Tu archivo CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="pageFlip">
  <div class="section bg-dark-red">
    <div class="ribbon-top"></div>

    <h1 class="main-title">Álbum Digital</h1>

    <div class="glass-card">
      <div class="camera-icon">📸</div>

      <p class="personal-message">¿Capturaste algún momento especial?</p>
      <p class="personal-message-second" style="font-family: 'Lato'; font-size: 0.9rem; color: var(--rosa); margin-bottom: 15px;">
        Comparte tus mejores fotos con los novios y ayúdanos a crear un recuerdo inolvidable.
      </p>
      <div class="upload-zone">
        <!-- Inputs ocultos (uno para galería, uno para cámara) -->
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        <!-- El atributo capture="environment" abre la cámara trasera directamente en móviles -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">

        <!-- Botones personalizados -->
        <div class="btn-group" id="btnGroup">
          <label for="fileInput" class="btn-select">
            <span>🖼️</span> Galería
          </label>
          <label for="cameraInput" class="btn-select">
            <span>📸</span> Tomar Foto
          </label>
        </div>

        <!-- Vista previa -->
        <div class="preview-container" id="previewContainer">
          <img id="imagePreview" src="" alt="Vista previa">
        </div>

        <button class="btn-upload" id="uploadBtn">
          <span>☁️</span> Subir al Álbum
        </button>

        <div class="status-msg" id="statusMsg"></div>
      </div>

    <p class="small-note" style="color: rgba(249,229,150,.5); font-size: 0.75rem; margin-top: 10px;">
      Tus fotos se guardarán de forma segura.
    </p>
  </div>
</div>

<!-- Tu archivo JS -->
<script src="js/app.js"></script>
</body>
</html>
